[package]
name = "aether-launcher"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "The launcher of the Aether Client, it installs Minecraft and starts it with an offline or a Microsoft account."
license = "MIT"
default-run = "aether-launcher"

[lib]
name = "aether_launcher"
path = "src/lib.rs"

[[bin]]
name = "aether-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The time of the logs is the local time of the player, the standard library only knows UTC.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
getrandom = "0.4"
zeroize = "1"
md-5 = "0.11"
zip = "9"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
