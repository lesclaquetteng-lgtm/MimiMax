[package]
name = "aether-desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "The native shell of the Aether Launcher: a Rust backend around the interface of the launcher."
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the oneshot channel is used: a blocking task answers through it.
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
