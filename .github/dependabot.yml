version: 2
updates:
  - package-ecosystem: cargo
    directory: /launcher
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-launcher:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /launcher/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-shell:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /aether-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /launcher
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
