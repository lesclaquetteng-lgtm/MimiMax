name: release

# A tag is the only way to publish: the files of a release are always built from the commit it
# points at, and the SHA256SUMS file next to them is produced by the same run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Reuse the complete PR/push CI (including the native WebView2 exercise) on the exact tag SHA.
  # Publication cannot start if any required check is failed, cancelled, skipped or missing.
  validate:
    name: Validate the tagged commit
    uses: ./.github/workflows/ci.yml

  windows:
    needs: validate
    name: Installers and mod jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and shipped package versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $core = [regex]::Match((Get-Content launcher/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $shell = [regex]::Match((Get-Content launcher/desktop/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $tauri = (Get-Content launcher/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $fabric = [regex]::Match((Get-Content aether-client/gradle.properties -Raw), '(?m)^version=([^\r\n]+)').Groups[1].Value
          $versions = [ordered]@{
            'launcher/Cargo.toml' = $core
            'launcher/desktop/Cargo.toml' = $shell
            'tauri.conf.json' = $tauri
            'aether-client/gradle.properties' = $fabric
          }
          $versions.GetEnumerator() | ForEach-Object {
            Write-Host "$($_.Key): $($_.Value)"
          }
          if (-not $tagVersion -or @($versions.Values | Where-Object { $_ -ne $tagVersion }).Count -gt 0) {
            throw "Release tag v$tagVersion does not match every shipped package version."
          }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test the launcher core
        working-directory: launcher
        run: |
          cargo test --release --locked
          cargo clippy --release --locked --all-targets -- -D warnings

      - name: Build the Fabric client
        working-directory: aether-client
        run: .\gradlew.bat --no-daemon build

      # The shell embeds the core and the mod at compile time, so both exist before it is built.
      - name: Build the launcher core
        working-directory: launcher
        run: cargo build --release --locked

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer and the portable executable
        working-directory: launcher/desktop
        run: cargo tauri build

      - name: Collect the artefacts and their checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          Get-ChildItem -Recurse launcher/desktop/target/release/bundle -Include *.exe |
            Copy-Item -Destination published
          Copy-Item aether-client/build/libs/*.jar published
          Get-ChildItem published -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File published/SHA256SUMS -Encoding ascii
          Get-Content published/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: published/*
          generate_release_notes: true
