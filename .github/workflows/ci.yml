name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        working-directory: launcher
        run: cargo test --locked
      - name: Clippy
        working-directory: launcher
        run: cargo clippy --locked --all-targets -- -D warnings

  electron-security:
    name: Electron security helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Electron main-process syntax
        working-directory: launcher
        run: node --check gui/src/main.cjs && node --check gui/src/preload.js
      - name: Test security and operation guards
        working-directory: launcher
        run: npm run test:security

  electron-e2e:
    name: Electron account and profile flows (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install Electron
        working-directory: launcher
        run: npm ci
      - name: Ensure the Electron runtime is present
        shell: pwsh
        working-directory: launcher
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          node .\\node_modules\\electron\\install.js
          $electronPath = (node -p "require('electron')").Trim()
          if (-not (Test-Path $electronPath)) { throw "Electron runtime is missing at $electronPath" }
          Write-Host "Electron runtime: $electronPath"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build launcher core
        working-directory: launcher
        run: cargo build --release --locked
      - name: Prepare isolated profile store
        shell: pwsh
        working-directory: launcher
        run: |
          $env:AETHER_HOME = Join-Path $env:RUNNER_TEMP "aether-e2e-home"
          $env:AETHER_SHARED_DIR = Join-Path $env:RUNNER_TEMP "minecraft-e2e"
          $env:AETHER_ANCHOR = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $env:AETHER_HOME, $env:AETHER_SHARED_DIR | Out-Null
          & ".\target\release\aether-launcher.exe" profiles add Hardcore --version 1.20.1 --loader 0.20.1 --memory 8192 --min-memory 2048 --width 1280 --height 720
          if ($LASTEXITCODE -ne 0) { throw "Could not seed the Hardcore test profile" }
      - name: Run real Electron account and profile flows
        shell: pwsh
        working-directory: launcher
        run: |
          $env:AETHER_HOME = Join-Path $env:RUNNER_TEMP "aether-e2e-home"
          $env:AETHER_SHARED_DIR = Join-Path $env:RUNNER_TEMP "minecraft-e2e"
          $env:AETHER_ANCHOR = $env:GITHUB_WORKSPACE
          $electronPath = (node -p "require('electron')").Trim()
          if (-not (Test-Path $electronPath)) { throw "Electron runtime is missing at $electronPath" }
          $electron = Start-Process -FilePath $electronPath -ArgumentList @(".", "--remote-debugging-port=9222", "--disable-gpu") -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            node ..\tools\e2e\profiles.mjs 9222
            if ($LASTEXITCODE -ne 0) { throw "Electron account/profile E2E failed" }
          } finally {
            if ($electron -and -not $electron.HasExited) {
              Stop-Process -Id $electron.Id -Force -ErrorAction SilentlyContinue
            }
          }

  fabric-mod:
    name: Fabric client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test Fabric mod
        working-directory: aether-client
        run: bash ./gradlew --no-daemon build
