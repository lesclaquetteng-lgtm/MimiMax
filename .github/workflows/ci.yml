name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        working-directory: launcher
        run: cargo test --locked
      - name: Clippy
        working-directory: launcher
        run: cargo clippy --locked --all-targets -- -D warnings

  electron-security:
    name: Electron security helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Electron and renderer syntax
        working-directory: launcher
        run: node --check gui/src/main.cjs && node --check gui/src/preload.js && node --check gui/src/ui/bridge.js && node --check gui/src/ui/app.js
      - name: Test launcher UI contracts
        working-directory: launcher
        run: node --test tests/ui-contract.test.cjs
      - name: Test security and operation guards
        working-directory: launcher
        run: npm run test:security

  tauri-e2e:
    name: Tauri native desktop flows (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build launcher core
        working-directory: launcher
        run: cargo build --release --locked
      - name: Test native desktop commands
        working-directory: launcher
        run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Build Tauri desktop shell
        working-directory: launcher
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Prepare isolated profile store
        shell: pwsh
        working-directory: launcher
        run: |
          $env:AETHER_HOME = Join-Path $env:RUNNER_TEMP "aether-tauri-e2e-home"
          $env:AETHER_SHARED_DIR = Join-Path $env:RUNNER_TEMP "minecraft-tauri-e2e"
          $env:AETHER_ANCHOR = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $env:AETHER_HOME, $env:AETHER_SHARED_DIR | Out-Null
          & ".\target\release\aether-launcher.exe" profiles add Hardcore --version 1.20.1 --loader 0.20.1 --memory 8192 --min-memory 2048 --width 1280 --height 720
          if ($LASTEXITCODE -ne 0) { throw "Could not seed the Hardcore test profile" }
      - name: Run native desktop account, profile and workspace flows
        shell: pwsh
        working-directory: launcher
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--remote-debugging-port=9222 --disable-gpu"
        run: |
          $env:AETHER_HOME = Join-Path $env:RUNNER_TEMP "aether-tauri-e2e-home"
          $env:AETHER_SHARED_DIR = Join-Path $env:RUNNER_TEMP "minecraft-tauri-e2e"
          $env:AETHER_ANCHOR = $env:GITHUB_WORKSPACE
          $desktopPath = Join-Path $PWD "desktop\target\release\aether-desktop.exe"
          if (-not (Test-Path $desktopPath)) { throw "Tauri desktop executable is missing at $desktopPath" }
          $desktop = Start-Process -FilePath $desktopPath -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            node ..\tools\e2e\profiles.mjs 9222
            if ($LASTEXITCODE -ne 0) { throw "Tauri account/profile E2E failed" }
            node ..\tools\e2e\a11y.mjs 9222
            if ($LASTEXITCODE -ne 0) { throw "Tauri accessibility/workspace E2E failed" }
          } finally {
            if ($desktop -and -not $desktop.HasExited) {
              Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            }
          }

  fabric-mod:
    name: Fabric client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test Fabric mod
        working-directory: aether-client
        run: bash ./gradlew --no-daemon build
