name: CI

on:
  # The PR event already tests every feature-branch update; keep push runs for main only
  # to avoid running the same matrix twice for each pull-request commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a given PR/ref; stale commits must not occupy CI runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        working-directory: launcher
        run: cargo test --locked
      - name: Clippy
        working-directory: launcher
        run: cargo clippy --locked --all-targets -- -D warnings

  shell:
    name: Native shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # The shell embeds both build products, so generate each one before compiling Tauri.
      - name: Build the Fabric client
        working-directory: aether-client
        run: .\gradlew.bat --no-daemon build
      - name: Build the launcher core
        working-directory: launcher
        run: cargo build --release --locked
      - name: Build and test the shell
        working-directory: launcher/desktop
        run: |
          cargo build --release --locked
          cargo test --release --locked

  theme-tokens:
    name: Theme tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A `var(--…)` without a definition is a rule the browser silently drops: the interface then
      # keeps an inherited value and nobody notices until a screen looks wrong.
      - name: Check every custom property of the interface
        run: node tools/check-theme-tokens.mjs
      - name: Validate launcher interface scripts
        run: |
          node --check launcher/gui/src/ui/app.js
          node --check launcher/gui/src/ui/bridge.js

  fabric-mod:
    name: Fabric client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test Fabric mod
        working-directory: aether-client
        run: bash ./gradlew --no-daemon build
