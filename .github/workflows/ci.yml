name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Test
        working-directory: launcher
        run: cargo test --locked
      - name: Clippy
        working-directory: launcher
        run: cargo clippy --locked --all-targets -- -D warnings

  shell:
    name: Native shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # The shell embeds both the core executable and the Fabric client jar.
      - name: Build the launcher core
        working-directory: launcher
        run: cargo build --release --locked
      - name: Build the embedded Fabric client jar
        working-directory: aether-client
        run: .\gradlew.bat --no-daemon build
      - name: Build and test the shell
        working-directory: launcher/desktop
        run: |
          cargo build --release --locked
          cargo test --release --locked

  renderer:
    name: Shared renderer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check renderer and bridge syntax
        run: node --check launcher/gui/src/ui/app.js && node --check launcher/gui/src/ui/bridge.js
      - name: Test launcher UI contracts
        run: node --test launcher/tests/ui-contract.test.cjs

  theme-tokens:
    name: Theme tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A `var(--…)` without a definition is a rule the browser silently drops: the interface then
      # keeps an inherited value and nobody notices until a screen looks wrong.
      - name: Check every custom property of the interface
        run: node tools/check-theme-tokens.mjs

  fabric-mod:
    name: Fabric client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test Fabric mod
        working-directory: aether-client
        run: bash ./gradlew --no-daemon build
